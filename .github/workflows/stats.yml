name: Language stats

on:
  schedule:
    - cron: "17 3 * * *" # chaque nuit à 03:17 UTC
  workflow_dispatch: {} # lancement manuel pour tester

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate language card
        run: node stats.mjs
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.plugin.languages.svg
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "chore: update language stats"
            git push
          fi
